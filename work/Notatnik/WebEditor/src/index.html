<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Notarium</title><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="math.css"></head>
<body><main id="editor" aria-label="Treść notatki"></main>
<dialog id="link-dialog"><form method="dialog"><label>Adres linku<input id="link-url" type="url" placeholder="https://" autocomplete="off"></label><div><button value="cancel">Anuluj</button><button id="link-save" value="save">Zapisz</button></div></form></dialog>
<dialog id="math-dialog"><form method="dialog"><label>Wzór LaTeX<textarea id="math-source" rows="3" placeholder="E = mc^2" spellcheck="false"></textarea></label><div class="math-options"><label><select id="math-layout"><option value="inlineMath">W tekście</option><option value="blockMath">Osobny wiersz</option></select></label><label class="check"><input id="math-numbered" type="checkbox">Automatyczna numeracja</label></div><div id="math-preview" aria-label="Podgląd wzoru"></div><p id="math-error" role="alert"></p><div><button value="cancel">Anuluj</button><button id="math-save" value="save">Wstaw</button></div></form></dialog>
<dialog id="image-dialog"><form method="dialog"><h3>Obraz</h3><label>Szerokość (px)<input id="image-width" type="number" min="20" max="4000" required></label><label>Tytuł nad obrazem<input id="image-title" maxlength="500"></label><label>Stopka pod obrazem<input id="image-caption" maxlength="2000"></label><button type="button" id="image-crop-toggle">Przytnij obraz…</button><div><button value="cancel" formnovalidate>Anuluj</button><button value="save">Zapisz</button></div></form></dialog>
<dialog id="table-dialog"><form method="dialog"><h3>Tabela</h3><label>Wiersze<input id="table-rows" type="number" min="1" max="20" value="3" required></label><label>Kolumny<input id="table-cols" type="number" min="1" max="20" value="3" required></label><div><button value="cancel" formnovalidate>Zamknij</button><button value="insert">Wstaw tabelę</button></div><div class="table-actions"><button type="button" data-table-command="addRowBefore">Wiersz powyżej</button><button type="button" data-table-command="addRowAfter">Wiersz poniżej</button><button type="button" data-table-command="addColumnBefore">Kolumna z lewej</button><button type="button" data-table-command="addColumnAfter">Kolumna z prawej</button><button type="button" data-table-command="deleteRow">Usuń wiersz</button><button type="button" data-table-command="deleteColumn">Usuń kolumnę</button><button type="button" data-table-command="mergeCells">Scal komórki</button><button type="button" data-table-command="splitCell">Podziel komórkę</button><button type="button" data-table-command="deleteTable">Usuń tabelę</button></div></form></dialog>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
<script src="editor.js"></script></body></html>
